name: Build Neo-Voxy multiversion
on:
  workflow_dispatch: # ✅ 手动点按钮启动构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: multiversion #锁定multiversion分支

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build mod with Gradle
        run: ./gradlew jar

      - name: Upload jar成品
        uses: actions/upload-artifact@v4
        with:
          name: neo-voxy-multiversion-jar
          path: build/libs/*.jar
          retention-days: 30
